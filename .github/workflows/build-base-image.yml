name: Build Hardened Base Image

on:
  workflow_dispatch:  # Manual trigger for on-demand builds
  schedule:
    - cron: '0 2 * * 0'  # Weekly: Sunday at 2 AM UTC
  push:
    branches:
      - main
    paths:
      - 'docker/base/**'
      - '.github/workflows/build-base-image.yml'

jobs:
  build-base:
    name: Build & Scan Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}            


      - name: Generate image tags
        id: tags
        run: |
          DATE=$(date +%Y%m%d)
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "dated=4.3.0-hardened-${DATE}" >> $GITHUB_OUTPUT
          echo "latest=4.3.0-hardened-latest" >> $GITHUB_OUTPUT
          echo "repo_owner=${REPO_OWNER}" >> $GITHUB_OUTPUT

      - name: Build base image (test)
        uses: docker/build-push-action@v5
        with:
          context: ./docker/base
          push: false
          load: true
          tags: wso2-mi-base:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wso2-mi-base:test
          format: 'sarif'
          output: 'trivy-base.sarif'
          severity: 'CRITICAL,HIGH'
          # TODO: Set exit-code to '1' once base image vulnerabilities are resolved
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-base.sarif'
          category: 'base-image'

      - name: Push base image to registry
        uses: docker/build-push-action@v5
        with:
          context: ./docker/base
          push: true
          tags: |
            ghcr.io/${{ steps.tags.outputs.repo_owner }}/wso2-mi-base:${{ steps.tags.outputs.dated }}
            ghcr.io/${{ steps.tags.outputs.repo_owner }}/wso2-mi-base:${{ steps.tags.outputs.latest }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build summary
        if: success()
        run: |
          echo "### Base Image Published" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.tags.outputs.repo_owner }}/wso2-mi-base:${{ steps.tags.outputs.dated }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.tags.outputs.repo_owner }}/wso2-mi-base:${{ steps.tags.outputs.latest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Built: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
